# Intelli-Stream Application Configuration

[model]
# Default model for inference.
# Options: yolov8n.pt, yolov8s.pt, etc.
name = "yolov8n.pt"

# Optional path to a custom model file.
# path = "/path/to/your/model.pt"

# Quantized model for efficiency mode.
# quantized_name = "yolov8n-int8.tflite"

[real_time_mode]
# Settings for high-performance machines.
confidence_threshold = 0.5
iou_threshold = 0.4
resolution = [720, 1280]   # [height, width]
frame_skip = 0

[efficiency_mode]
# Settings for low-power devices like Raspberry Pi.
confidence_threshold = 0.4
iou_threshold = 0.4
resolution = [320, 320]    # [height, width]
frame_skip = 5

[camera]
# Type of camera source. Options: "usb", "rtsp".
source_type = "usb"

# --- USB Camera Settings ---
device_id = 0
# Resolution for USB camera capture.
resolution = [720, 1280] # [height, width]

# --- RTSP Camera Settings ---
# Transport protocol. "tcp" is more reliable over Wi-Fi, "udp" can be lower latency.
rtsp_transport = "tcp"
# Timeout in seconds for initial camera connection attempts.
connection_timeout = 10
